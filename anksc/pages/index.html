  >

  <div
    id="popupStart"
    class="popup start"
  >
    <div class="level popup-grid">
      <span>Level:</span>
      <select
        name="level"
        id="level"
        class="bubble"
      >
        <option
          value="1"
          selected
        >1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="languages">
      <div class="popup-grid">
        <span>To:</span>
        <select
          name="lang2"
          id="lang2"
          class="bubble"
        >
          <option value="tr">Turkish</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">Deutsch</option>
          <option value="it">Italian</option>
          <option value="fa">Farsi</option>
        </select>
      </div>
      <div class="popup-grid">
        <span>&#8673;</span>
        <button
          id="btnSwap"
          class="bubble bubble--highlight btn-swap"
          style="margin-left: 70px !important;"
        >
          <i style="font-size: 25px; margin-top: -5px !important;">&#8597;</i>
        </button>
      </div>
      <div class="popup-grid">
        <span>From:</span>
        <select
          name="lang1"
          id="lang1"
          class="bubble"
        >
          <option value="tr">Turkish</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">Deutsch</option>
          <option value="it">Italian</option>
          <option value="fa">Farsi</option>
        </select>
      </div>
    </div>

    <div style="display: flex;
    justify-content: space-evenly;
    width: 100%;">


      <a href="/match">
        <div
          class="bubble bubble--highlight"
        >
          MATCH
        </div>
      </a>


      <div
        id="btnStart"
        class="bubble bubble--highlight"
      >
        TRAINING
      </div>

    </div>

  </div>








  <div
    id="paper"
    class="d-none"
  >
    <div class="time-container">
      <progress
        value="0"
        id="progressBar"
      ></progress>
    </div>
    <!-- <div class="point-container">
      <span id="point"></span>
      <i style="font-size: 10px; ">point</i>
    </div> -->
    <div class="next-container">
      <button
        id="btnNext"
        class="d-none"
      >&#10159;</button>
      <button
        id="btnAnswer"
        class="d-none btn btn-answer"
      >See the Answer?</button>
    </div>
    <div id="pattern">
      <div id="result"></div>

      <div id="words"></div>

      <div id="blurred">
        <div id="translate">
        </div>
      </div>
    </div>
